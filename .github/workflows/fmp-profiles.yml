name: 抓取 FMP 行业分类（全部个股）

# 手动触发：Actions 标签页 → 本 workflow → Run workflow。
# 可选输入：
#   limit —— 本次最多抓取个数（默认 200；FMP 免费额度 250 次/天，留余量）。
#            518 只约 3 天抓全，之后每日只补指数调仓新增的 ticker。
#   apikey —— FMP API Key。**推荐**在仓库 Settings → Secrets and variables →
#            Actions 添加 FMP_API_KEY（只需配一次，之后输入框留空即可）；
#            没配 secret 时在输入框粘贴 key 也能跑。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本次最多抓取个数（默认 200）"
        required: false
        default: "200"
      apikey:
        description: "FMP API Key（留空则用 Secret: FMP_API_KEY）"
        required: false
        default: ""

permissions:
  contents: write   # 用于把抓取结果提交回仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 200 个 × (0.35s 间隔 + 请求耗时 + 偶发重试) 通常 3~5 分钟；留足余量
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取 FMP sector / industry
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || github.event.inputs.apikey }}
        run: |
          if [ -z "$FMP_API_KEY" ]; then
            echo "::error::未提供 FMP API Key：在运行弹窗的 apikey 输入框粘贴，或在仓库 Settings → Secrets 添加 FMP_API_KEY"
            exit 1
          fi
          python3 fetch_fmp_profiles.py --limit "${{ github.event.inputs.limit || '200' }}"

      - name: 提交结果（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_stocks.json fmp_profiles.json
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新 FMP 行业分类 $(date +'%Y-%m-%d')"
            git push
          fi
