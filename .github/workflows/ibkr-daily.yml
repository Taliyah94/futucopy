name: IBKR 每日资产同步

on:
  schedule:
    # ============================================================
    # 目标：美东时间（America/New_York）每天 00:05 抓 IBKR 1day 快照。
    # GitHub Actions 的 cron 只认 UTC，且**不会随夏令时自动切换**，
    # 所以「美东 00:05」在两种时制下对应不同的 UTC：
    #   - 冬令时 EST（UTC−5，约 11 月初～次年 3 月中）：美东 00:05 = 05:05 UTC → `5 5 * * *`
    #   - 夏令时 EDT（UTC−4，约 3 月中～11 月初）：美东 00:05 = 04:05 UTC → `5 4 * * *`
    # DST 边界（美国）：
    #   - 开始：3 月第 2 个周日（2026-03-08）凌晨 02:00 拨快到 03:00
    #   - 结束：11 月第 1 个周日（2026-11-01）凌晨 02:00 拨慢到 01:00
    # 两条 cron 都挂上，由下面「DST 自适应守护」步判断：只有当前美东时间
    # 真落在 00:00–00:10 窗口内的那一次才真正执行，另一次优雅跳过。
    # 这样无论冬夏令时切换，全年都精确在美东 00:05 跑一次，且不选整点高峰。
    # ============================================================
    - cron: "5 4 * * *"   # UTC 04:05 = 美东 00:05（夏令时 EDT 期间命中）
    - cron: "5 5 * * *"   # UTC 05:05 = 美东 00:05（冬令时 EST 期间命中）
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新同步（忽略今日已同步标记）"
        type: boolean
        default: false

permissions:
  contents: write        # 允许把更新后的 Asset_parsed.json 提交回仓库

concurrency:
  group: ibkr-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 单次轻量：每个阶段最多 2 次尝试（首次 + 退避 20s 重试 1 次），最坏约 1 分钟。
    # 给 5 分钟余量，足以覆盖 IBKR 接口抖动与 Actions 自身调度延迟。
    timeout-minutes: 5
    steps:
      # ---------------------------------------------------------------
      # DST 自适应守护：只有在「美东 00:05 窗口」内（或手动触发）才继续，
      # 否则本触发整体跳过。runner 自带 America/New_York 时区数据，
      # 用 TZ 环境变量读本地时间即可，无需自己算 DST 边界。
      # ---------------------------------------------------------------
      - name: DST 自适应守护（仅美东 00:05 窗口执行）
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 手动触发，跳过时间窗口检查"
            exit 0
          fi
          now_et=$(TZ="America/New_York" date +"%H:%M")
          hh=${now_et%%:*}; mm=${now_et##*:}
          # 只在 00:00–00:10 ET 之间执行；另一 UTC 候选触发会落在此区间外被跳过
          if [ "$hh" = "00" ] && [ "${mm#0}" -le 10 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 命中美东 00:05 窗口（当前 $now_et），继续同步"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::当前美东 $now_et，不在 00:05 窗口内，本触发跳过（由另一个 UTC 候选负责）"
          fi

      - name: 检出仓库
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------
      # 密钥自检：脚本缺 IBKR_TOKEN / IBKR_QUERY_ID_1DAY 时会在 1 秒内
      # sys.exit(1)（退出码 1），而 [warn]/[skip]/[ok] 三条正常路径都是
      # 退出码 0 —— 所以「job 10 秒就红」几乎必然是 secrets 没配，
      # 与其让人对着 "脚本报错（退出码 1）" 猜，不如在这里直接点名。
      # 注意：这里只判断「secrets 是否存在」，不打印 secrets 的内容。
      # ---------------------------------------------------------------
      - name: 检查 Secrets 是否配置
        if: steps.guard.outputs.run == 'true'
        run: |
          MISSING=()
          [ -z "${{ secrets.IBKR_TOKEN }}" ] && MISSING+=("IBKR_TOKEN")
          [ -z "${{ secrets.IBKR_QUERY_ID_1DAY }}" ] && MISSING+=("IBKR_QUERY_ID_1DAY")
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::仓库缺少需要的 Secrets：${MISSING[*]}"
            echo "        请在仓库 Settings → Secrets and variables → Actions 添加后再重跑。"
            exit 1
          fi
          echo "✅ IBKR_TOKEN / IBKR_QUERY_ID_1DAY 已配置"

      - name: 运行 IBKR 1day 解析脚本
        if: steps.guard.outputs.run == 'true'
        env:
          IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
          IBKR_QUERY_ID_1DAY: ${{ secrets.IBKR_QUERY_ID_1DAY }}
          JSON_PATH: ${{ github.workspace }}/Asset_parsed.json
          FORCE_ARG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          set -o pipefail
          OUT=$(python parse_ibkr_asset1day.py $FORCE_ARG 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "$OUT" | grep -q "ERROR: 需设置 IBKR_TOKEN" \
              && echo "::error::脚本报的是缺密钥，请看上一步「检查 Secrets 是否配置」" \
              || echo "::error::脚本报错（退出码 $RC），请看上方堆栈"
            exit $RC
          fi
          if echo "$OUT" | grep -q "\[ok\] 同步成功"; then
            echo "✅ 本次已写入数据"
          elif echo "$OUT" | grep -q "\[skip\] 今日"; then
            echo "ℹ️ 今日已同步过，跳过（正常）"
          elif echo "$OUT" | grep -q "\[warn\] 拉取失败"; then
            echo "::warning::IBKR 报表未就绪，本次未写入（次日美东 00:05 再试）"
          else
            echo "ℹ️ 脚本退出码为 0 但未命中 [ok]/[skip]/[warn]，检查上方日志"
          fi

      - name: 提交并推送更新后的 JSON
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Asset_parsed.json
          # 仅当 JSON 有变化才提交（避免无谓的空提交触发 Pages 重建）
          if git diff --cached --quiet; then
            echo "Asset_parsed.json 无变化，跳过提交"
          else
            git commit -m "chore: 每日同步 IBKR 资产快照 $(date +%Y-%m-%d)"
            git push
          fi
