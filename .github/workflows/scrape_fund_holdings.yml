name: 抓取基金持仓与净值

# 手动触发：在 GitHub 仓库的 Actions 标签页点「Run workflow」即可。
# 每日自动抓取：净值(nav)与季报前十大持仓(items) 一并刷新。
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "要抓取的基金代码（逗号分隔，留空则用脚本默认列表）"
        required: false
        default: ""
      output:
        description: "输出 JSON 的相对路径"
        required: false
        default: "fund_holdings.json"

  # 每日自动抓取：美东时间 09:30（美股开盘，前一日净值已确定发布）。
  # GitHub cron 仅支持 UTC 且不自动随夏令时切换：
  #   夏令时 EDT(3–11月) 美东9:30 = UTC 13:30  -> 下方取值
  #   冬令时 EST         美东9:30 = UTC 14:30  -> 需改为 "30 14 * * *"
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write   # 用于把抓取结果提交回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取基金季报
        run: |
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          ARGS="-o $OUT"
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            ARGS="$ARGS --codes ${{ github.event.inputs.codes }}"
          fi
          python3 fund_holdings.py $ARGS

      # Reddit 帖子（ORCL / TQQQ）：oanor 的 reddit-api **不给 CORS 头**，
      # 前端无法直连，只能 Actions 抓成静态 JSON 供页面读。
      # 本 workflow（UTC 13:30）+ ibkr-daily（UTC 05:10）= 一天 2 次
      # = 4 次调用/天 ≈ 120 次/月（oanor 上限 500）。失败只告警，不影响基金抓取。
      - name: 抓取 Reddit 帖子（ORCL / TQQQ）
        continue-on-error: true
        env:
          OANOR_KEY: ${{ secrets.OANOR_KEY }}
        run: |
          if [ -z "${OANOR_KEY}" ]; then
            echo "::warning::未配置 Secrets.OANOR_KEY，跳过 Reddit 抓取（不影响基金抓取）"
            exit 0
          fi
          python fetch_reddit.py || echo "::warning::Reddit 抓取失败，沿用上一版 reddit_posts.json"

      - name: 提交结果（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          git add "$OUT" reddit_posts.json
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新基金持仓与净值 $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
