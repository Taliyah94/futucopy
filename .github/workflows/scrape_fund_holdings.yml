name: 抓取基金持仓与净值

# 手动触发：在 GitHub 仓库的 Actions 标签页点「Run workflow」即可。
# 每日自动抓取：净值(nav)与季报前十大持仓(items) 一并刷新。
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "要抓取的基金代码（逗号分隔，留空则用脚本默认列表）"
        required: false
        default: ""
      output:
        description: "输出 JSON 的相对路径"
        required: false
        default: "fund_holdings.json"

  # 单 cron（2026-10-16 调整）：UTC 21:00 = 北京 05:00 = 美东 17:00 EDT / 16:00 EST
  # （收盘后 1h）。此前 23:00 北京（美东 11:00 盘中）抓时，财政部 10Y 美债（美东 16:00
  # 才发布）还没出 → 美债永远慢一天；延后到收盘后，财政部/股指收盘值均已就绪，
  # USDCNH(ECB ~14:00 UTC) 与基金净值也仍是当天最新。
  schedule:
    - cron: "0 21 * * *"   # = 北京 05:00（美东 17:00 EDT / 16:00 EST，收盘后 1h）

permissions:
  contents: write   # 用于把抓取结果提交回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取基金季报
        run: |
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          ARGS="-o $OUT"
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            ARGS="$ARGS --codes ${{ github.event.inputs.codes }}"
          fi
          python3 fund_holdings.py $ARGS

      - name: 提交结果（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          git add "$OUT"
          # 「全部个股」聚合结果（fund_holdings.py 每次抓取顺带生成；文件不存在时忽略）
          # 名次变动已内联进 all_stocks.json 每行的 rk 字段，不再单独生成文件。
          git add all_stocks.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新基金持仓与净值 $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
