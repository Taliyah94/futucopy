name: 抓取基金持仓与净值

# 手动触发：在 GitHub 仓库的 Actions 标签页点「Run workflow」即可。
# 每日自动抓取：净值(nav)与季报前十大持仓(items) 一并刷新。
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "要抓取的基金代码（逗号分隔，留空则用脚本默认列表）"
        required: false
        default: ""
      output:
        description: "输出 JSON 的相对路径"
        required: false
        default: "fund_holdings.json"

  # 单 cron（用户 2026-10-13 定稿，由「一天两次」改回一次）：UTC 15:00 = 北京 23:00
  # = 美东 11:00 EDT / 10:00 EST（前一日净值已发布；historyofmarket 每天 ~10:10 UTC
  # 批量刷新成分股、ECB ~14:00 UTC 发布当日汇率，均在其之前，拿到的都是最新数据）。
  schedule:
    - cron: "0 15 * * *"   # = 北京 23:00（美东 11:00 EDT / 10:00 EST）

permissions:
  contents: write   # 用于把抓取结果提交回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取基金季报
        run: |
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          ARGS="-o $OUT"
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            ARGS="$ARGS --codes ${{ github.event.inputs.codes }}"
          fi
          python3 fund_holdings.py $ARGS

      - name: 提交结果（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          git add "$OUT"
          # 「全部个股」聚合结果（fund_holdings.py 每次抓取顺带生成；文件不存在时忽略）
          # 名次变动已内联进 all_stocks.json 每行的 rk 字段，不再单独生成文件。
          git add all_stocks.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新基金持仓与净值 $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
